[package]
name = "cyberbox"
version = "0.1.0"
edition = "2021"

[dependencies]
cyberbox-core = { path = "../cyberbox-core" }
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
